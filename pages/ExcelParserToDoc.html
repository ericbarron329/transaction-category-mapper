<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Sheets to DOCX</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://unpkg.com/docxtemplater@3.37.9/build/docxtemplater.js"></script>
  <script src="https://unpkg.com/pizzip@3.1.6/dist/pizzip.js"></script>
  <style>
    pre {
      background-color: #f5f5f5;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
    }
    .values-container {
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h2>Google Sheets → DOCX Exporter</h2>

  <input type="text" id="sheetUrl" placeholder="Paste Google Sheets URL" size="60" />
  <button id="loadBtn">Load Sheet</button>
  <!-- <button id="generateBtn">Generate DOCX</button> -->

  <div class="values-container">
    <h3>Processed Values:</h3>
    <pre id="valuesOutput">Waiting for input...</pre>
  </div>

  <div class="values-container">
    <h3>Raw Data:</h3>
    <pre id="output">Waiting for input...</pre>
  </div>

  <script type="module">
    import { generateDocument } from '../scripts/2_ExcelParserToDoc.js';

    document.getElementById('loadBtn').addEventListener('click', async () => {
      const url = document.getElementById('sheetUrl').value;
      const output = document.getElementById('output');
      const valuesOutput = document.getElementById('valuesOutput');
      output.textContent = "Loading sheet data...";
      valuesOutput.textContent = "Processing values...";

      try {
        const result = await generateDocument(url);
        console.log('Raw Sheet Data:', result.sheetData);
        valuesOutput.textContent = JSON.stringify(result.values, null, 2);
      } catch (err) {
        output.textContent = `Error: ${err.message}`;
        valuesOutput.textContent = `Error: ${err.message}`;
        console.error('Error:', err);
      }
    });

    document.getElementById('generateBtn').addEventListener('click', async () => {
      try {
        await fillDocxWithValues();
      } catch (err) {
        document.getElementById('output').textContent = `Error: ${err.message}`;
      }
    });
  </script>
</body>
</html>
